<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Terminal</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fafafa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Terminal">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    .term-shell {
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 600px) {
      .term-shell {
        padding: 0;
      }
      #view-terminal {
        border-radius: 0 !important;
        border-left: none !important;
        border-right: none !important;
        border-top: none !important;
        box-shadow: none !important;
      }
    }
    #view-terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
      position: relative;
    }

    /* Top Bar */
    .term-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .term-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .term-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .term-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }
    .term-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--border-subtle);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .status-btn:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .status-btn.ready .status-dot {
      background: #10b981;
    }

    /* Settings Drawer */
    .settings-panel {
      display: none;
      background: #f9fafb;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .settings-panel.open {
      display: flex;
    }
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .field-input {
      width: 100%;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .field-input:focus {
      border-color: var(--text);
    }
    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .btn-sm {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
    }
    .btn-sm.primary {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    /* Terminal Output Screen */
    #terminal-screen {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
    }
    .log-entry {
      margin-bottom: 14px;
    }
    .log-cmd {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .log-cmd .prompt-sign {
      color: var(--text-dim);
      font-weight: 400;
      user-select: none;
    }
    .log-out {
      color: var(--text-muted);
      padding-left: 14px;
      border-left: 1.5px solid var(--border);
    }
    .log-err {
      color: #dc2626;
      padding-left: 14px;
      border-left: 1.5px solid #fca5a5;
    }
    .log-muted {
      color: var(--text-dim);
      font-size: 12px;
    }

    /* Quick Action Bar */
    .accessory-bar {
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .accessory-bar::-webkit-scrollbar { display: none; }
    .tool-chip {
      background: #f9fafb;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 5px 11px;
      border-radius: 7px;
      white-space: nowrap;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      touch-action: manipulation;
      transition: all 0.12s;
    }
    .tool-chip:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }
    .tool-chip:active {
      background: var(--border-subtle);
      transform: scale(0.97);
    }
    .tool-chip.accent {
      background: var(--text);
      border-color: var(--text);
      color: #ffffff;
      font-weight: 500;
    }
    .tool-chip.accent:hover {
      opacity: 0.9;
      color: #ffffff;
    }

    /* Input Line */
    .term-input-line {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .cli-prefix {
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      caret-color: var(--text);
      padding: 4px 0;
    }
    #cmd-input::placeholder {
      color: #d1d5db;
    }
    .send-icon-btn {
      background: var(--text);
      border: none;
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-icon-btn:hover { opacity: 0.88; }
    .send-icon-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="term-shell">
    <div id="view-terminal">
      <!-- Top Bar -->
      <div class="term-bar">
        <div class="term-bar-left">
          <span class="term-title">imac</span>
          <span class="term-sub">~ zsh</span>
        </div>
        <div class="term-bar-right">
          <button type="button" class="status-btn" id="status-btn" onclick="toggleSettings()">
            <span class="status-dot"></span>
            <span id="status-text">Setup</span>
          </button>
        </div>
      </div>

      <!-- Inline Settings Drawer -->
      <div class="settings-panel" id="settings-panel">
        <div class="field-row">
          <label class="field-label" for="cfg-api">Endpoint URL</label>
          <input class="field-input" id="cfg-api" type="url" placeholder="https://xxxx.trycloudflare.com" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field-row">
          <label class="field-label" for="cfg-token">Access Token</label>
          <input class="field-input" id="cfg-token" type="password" placeholder="Token" autocomplete="off" spellcheck="false" />
        </div>
        <div class="settings-actions">
          <button type="button" class="btn-sm" onclick="toggleSettings(false)">Cancel</button>
          <button type="button" class="btn-sm primary" onclick="saveSettings()">Save</button>
        </div>
      </div>

      <!-- Terminal Output -->
      <div id="terminal-screen">
        <div class="log-entry log-muted">iMac 24GB node ready.</div>
      </div>

      <!-- Quick Chips -->
      <div class="accessory-bar">
        <button type="button" class="tool-chip accent" onclick="fillAgent(event)">agent</button>
        <button type="button" class="tool-chip" onclick="quickRun('status')">status</button>
        <button type="button" class="tool-chip" onclick="quickRun('uptime')">uptime</button>
        <button type="button" class="tool-chip" onclick="fillSay(event)">say</button>
        <button type="button" class="tool-chip" onclick="quickRun('ls -la')">ls</button>
        <button type="button" class="tool-chip" onclick="quickRun('df -h /')">df</button>
        <button type="button" class="tool-chip" onclick="clearScreen()">clear</button>
      </div>

      <!-- Command Input -->
      <form class="term-input-line" onsubmit="handleCommand(event)">
        <span class="cli-prefix">%</span>
        <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="agent &quot;작업 내용&quot; 또는 명령어" />
        <button type="submit" class="send-icon-btn" aria-label="Run">↵</button>
      </form>
    </div>
  </div>

  <script src="/site.js"></script>
  <script>
    const screen = document.getElementById('terminal-screen');
    const input = document.getElementById('cmd-input');
    const statusBtn = document.getElementById('status-btn');
    const statusText = document.getElementById('status-text');
    const settingsPanel = document.getElementById('settings-panel');
    const cfgApi = document.getElementById('cfg-api');
    const cfgToken = document.getElementById('cfg-token');

    const cmdHistory = [];
    let historyIdx = -1;

    const getApi = () => localStorage.getItem('imac_api_endpoint') || '';
    const getToken = () => localStorage.getItem('imac_token') || '';

    // Auto-read from URL hash: /terminal/#api=https://xxxx.trycloudflare.com&token=XXXX
    (function initSetup() {
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.get('api')) localStorage.setItem('imac_api_endpoint', h.get('api').replace(/\/$/, ''));
      if (h.get('token')) localStorage.setItem('imac_token', h.get('token'));
      if (h.get('api') || h.get('token')) history.replaceState('', document.title, location.pathname);
      updateStatusUI();
    })();

    function updateStatusUI() {
      const hasConfig = Boolean(getApi());
      statusBtn.classList.toggle('ready', hasConfig);
      statusText.textContent = hasConfig ? 'iMac' : 'Setup';
    }

    function toggleSettings(force) {
      const next = typeof force === 'boolean' ? force : !settingsPanel.classList.contains('open');
      if (next) {
        cfgApi.value = getApi();
        cfgToken.value = getToken();
      }
      settingsPanel.classList.toggle('open', next);
    }

    function saveSettings() {
      const apiVal = cfgApi.value.trim().replace(/\/$/, '');
      const tokenVal = cfgToken.value.trim();
      if (apiVal) localStorage.setItem('imac_api_endpoint', apiVal);
      else localStorage.removeItem('imac_api_endpoint');

      if (tokenVal) localStorage.setItem('imac_token', tokenVal);
      else localStorage.removeItem('imac_token');

      updateStatusUI();
      toggleSettings(false);
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function scrollToBottom() {
      screen.scrollTop = screen.scrollHeight;
    }

    function appendEntry(html) {
      const d = document.createElement('div');
      d.className = 'log-entry';
      d.innerHTML = html;
      screen.appendChild(d);
      scrollToBottom();
      return d;
    }

    function clearScreen() {
      screen.innerHTML = '';
    }

    function fillAgent(e) {
      if (e) e.preventDefault();
      input.value = 'agent ""';
      input.focus();
      setTimeout(() => {
        input.focus();
        try { input.setSelectionRange(7, 7); } catch (_) {}
      }, 40);
    }

    function fillSay(e) {
      if (e) e.preventDefault();
      input.value = 'say ""';
      input.focus();
      setTimeout(() => {
        input.focus();
        try { input.setSelectionRange(5, 5); } catch (_) {}
      }, 40);
    }

    function quickRun(cmd) {
      input.value = '';
      executeCommand(cmd);
    }

    function handleCommand(e) {
      e.preventDefault();
      const cmd = input.value;
      if (cmd.trim()) {
        input.value = '';
        executeCommand(cmd);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        if (cmdHistory.length > 0 && historyIdx < cmdHistory.length - 1) {
          e.preventDefault();
          historyIdx++;
          input.value = cmdHistory[cmdHistory.length - 1 - historyIdx];
        }
      } else if (e.key === 'ArrowDown') {
        if (historyIdx > 0) {
          e.preventDefault();
          historyIdx--;
          input.value = cmdHistory[cmdHistory.length - 1 - historyIdx];
        } else if (historyIdx === 0) {
          e.preventDefault();
          historyIdx = -1;
          input.value = '';
        }
      }
    });

    async function executeCommand(cmd) {
      const trimmed = cmd.trim();
      if (trimmed === 'clear') {
        clearScreen();
        return;
      }

      cmdHistory.push(cmd);
      historyIdx = -1;

      if (!getApi()) {
        toggleSettings(true);
        appendEntry(`
          <div class="log-cmd"><span class="prompt-sign">%</span><span>${esc(cmd)}</span></div>
          <div class="log-err">연결 정보가 없습니다. 상단 설정 창에 Endpoint URL과 Token을 저장하세요.</div>
        `);
        return;
      }

      const isAgent = trimmed.startsWith('agent ');
      const entry = appendEntry(`
        <div class="log-cmd"><span class="prompt-sign">%</span><span>${esc(cmd)}</span></div>
        <div class="log-muted">${isAgent ? 'agent working…' : 'running…'}</div>
      `);
      const bodyEl = entry.lastElementChild;

      try {
        const res = await fetch(getApi() + '/api/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': getToken() },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();

        if (res.status === 401) {
          bodyEl.className = 'log-err';
          bodyEl.textContent = '인증 실패: 우측 상단 [iMac] 버튼을 눌러 올바른 Token을 입력하세요.';
        } else if (data.output) {
          bodyEl.className = 'log-out';
          bodyEl.textContent = data.output.replace(/\n$/, '');
        } else if (data.error) {
          bodyEl.className = 'log-err';
          bodyEl.textContent = data.error.replace(/\n$/, '');
        } else {
          bodyEl.className = 'log-muted';
          bodyEl.textContent = 'done.';
        }
      } catch (err) {
        bodyEl.className = 'log-err';
        bodyEl.textContent = `연결 실패 (${err.message}). 우측 상단 [iMac] 설정에서 주소를 확인하세요.`;
      }
      scrollToBottom();
    }
  </script>
</body>
</html>
