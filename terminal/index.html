<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal — wooyoung.me</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="wooyoung.me">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .nav-back {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--term-dim);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-back:hover {
      color: var(--term-text);
    }
    #view-terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--term-bg);
      border: 1px solid var(--term-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .term-bar {
      background: var(--term-card);
      border-bottom: 1px solid var(--term-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .term-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--term-dim); font-weight: 600; }
    .node-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: rgba(63, 185, 80, 0.15);
      color: var(--term-green);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(63, 185, 80, 0.3);
      cursor: pointer;
    }
    #terminal-screen {
      flex: 1;
      min-height: 280px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.55;
      color: var(--term-text);
      word-break: break-word;
      white-space: pre-wrap;
    }
    .accessory-bar {
      background: var(--term-card);
      border-top: 1px solid var(--term-border);
      padding: 8px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .accessory-bar::-webkit-scrollbar { display: none; }
    .tool-chip {
      background: #21262d;
      border: 1px solid var(--term-border);
      color: #c9d1d9;
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      touch-action: manipulation;
    }
    .tool-chip:active { background: #30363d; color: #fff; transform: scale(0.96); }
    .tool-chip.accent { background: rgba(88, 166, 255, 0.18); border-color: rgba(88, 166, 255, 0.5); color: #79b8ff; font-weight: bold; }
    .term-input-line {
      background: #090d13;
      border-top: 1px solid var(--term-border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cli-prefix { color: var(--term-green); font-size: 13px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      caret-color: var(--term-green);
      padding: 4px 0;
    }
    .send-icon-btn {
      background: #238636;
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-icon-btn:active { background: #2ea043; transform: scale(0.95); }
  </style>
</head>
<body class="dark">
  <div class="container">
    <header>
      <a href="/" class="nav-back">← Wooyoung</a>
    </header>

    <div id="view-terminal">
      <div class="term-bar">
        <div class="term-title">apple@imac-24gb: ~ (zsh)</div>
        <div class="node-status" id="node-status" onclick="configure()">● iMac</div>
      </div>

      <div id="terminal-screen">
        <div style="color:#8b949e;">iMac 27" 5K (24GB) — Antigravity agent ready.</div>
        <div style="color:#8b949e;">[agent]를 눌러 한글로 작업을 지시하세요.</div>
        <br>
      </div>

      <div class="accessory-bar">
        <button type="button" class="tool-chip accent" onclick="fillAgent(event)">agent</button>
        <button type="button" class="tool-chip" onclick="quickRun('status')">status</button>
        <button type="button" class="tool-chip" onclick="quickRun('uptime')">uptime</button>
        <button type="button" class="tool-chip" onclick="fillSay(event)">say</button>
        <button type="button" class="tool-chip" onclick="quickRun('ls -la')">ls</button>
        <button type="button" class="tool-chip" onclick="quickRun('df -h /')">df</button>
        <button type="button" class="tool-chip" onclick="clearScreen()">clear</button>
      </div>

      <form class="term-input-line" onsubmit="handleCommand(event)">
        <span class="cli-prefix">%</span>
        <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="agent &quot;작업 내용&quot;" />
        <button type="submit" class="send-icon-btn">↵</button>
      </form>
    </div>

    <footer>
      <div class="footer-label">Connect</div>
      <p class="footer-text">
        Reach me at <a href="mailto:fz7948@gmail.com" class="footer-link">fz7948@gmail.com</a>, 
        <a href="https://github.com/fz7948" target="_blank" rel="noopener" class="footer-link">GitHub</a>, or 
        <a href="https://fz7948.tistory.com" target="_blank" rel="noopener" class="footer-link">Blog</a>.
      </p>
    </footer>
  </div>
  <script src="/site.js"></script>
  <script>
    const screen = document.getElementById('terminal-screen');
    const input = document.getElementById('cmd-input');

    // Connection settings live only in this device's localStorage (never in the repo).
    // First-time setup link:  /terminal/#api=https://xxxx.trycloudflare.com&token=XXXX
    (function readSetup() {
      const h = new URLSearchParams(location.hash.slice(1));
      if (h.get('api')) localStorage.setItem('imac_api_endpoint', h.get('api').replace(/\/$/, ''));
      if (h.get('token')) localStorage.setItem('imac_token', h.get('token'));
      if (h.get('api') || h.get('token')) history.replaceState('', document.title, location.pathname);
    })();

    const getApi = () => localStorage.getItem('imac_api_endpoint') || '';
    const getToken = () => localStorage.getItem('imac_token') || '';

    function configure() {
      const api = prompt('iMac endpoint URL:', getApi());
      if (api === null) return;
      const token = prompt('Access token:', getToken());
      if (api.trim()) localStorage.setItem('imac_api_endpoint', api.trim().replace(/\/$/, ''));
      if (token !== null && token.trim()) localStorage.setItem('imac_token', token.trim());
    }

    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function scrollToBottom() { screen.scrollTop = screen.scrollHeight; }
    function appendLine(html) {
      const d = document.createElement('div');
      d.innerHTML = html;
      screen.appendChild(d);
      scrollToBottom();
    }
    function clearScreen() { screen.innerHTML = "<div style='color:#8b949e;'>cleared.</div><br>"; }

    function fillAgent(e) {
      if (e) e.preventDefault();
      input.value = 'agent ""';
      input.focus();
      setTimeout(() => { input.focus(); try { input.setSelectionRange(7, 7); } catch (err) {} }, 50);
    }
    function fillSay(e) {
      if (e) e.preventDefault();
      input.value = 'say ""';
      input.focus();
      setTimeout(() => { input.focus(); try { input.setSelectionRange(5, 5); } catch (err) {} }, 50);
    }
    function quickRun(cmd) { input.value = cmd; executeCommand(cmd); }
    function handleCommand(e) {
      e.preventDefault();
      const cmd = input.value;
      if (cmd.trim()) executeCommand(cmd);
    }

    async function executeCommand(cmd) {
      input.value = '';
      appendLine(`<span style="color:#3fb950;font-weight:bold;">apple@imac-24gb</span> <span style="color:#58a6ff;">~</span> <span style="color:#8b949e;">%</span> <span style="color:#fff;font-weight:bold;">${esc(cmd)}</span>`);
      if (cmd.trim() === 'clear') { clearScreen(); return; }

      if (!getApi()) {
        appendLine(`<span style="color:#d29922;">아직 연결 설정이 없습니다. 우측 상단 [● iMac]을 눌러 endpoint와 token을 입력하세요.</span><br>`);
        return;
      }

      const pid = 'pending-' + Date.now();
      const isAgent = cmd.trim().startsWith('agent ');
      appendLine(`<span style="color:#8b949e;" id="${pid}">${isAgent ? 'agent working…' : 'running…'}</span>`);

      try {
        const res = await fetch(getApi() + '/api/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': getToken() },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        const p = document.getElementById(pid); if (p) p.remove();
        if (res.status === 401) {
          appendLine(`<span style="color:#f85149;">인증 실패: token이 올바르지 않습니다. [● iMac]에서 다시 입력하세요.</span>`);
        } else if (data.output) {
          appendLine(`<span style="color:#e6edf3;">${esc(data.output)}</span>`);
        } else if (data.error) {
          appendLine(`<span style="color:#f85149;">${esc(data.error)}</span>`);
        } else {
          appendLine(`<span style="color:#8b949e;">(no output)</span>`);
        }
      } catch (err) {
        const p = document.getElementById(pid); if (p) p.remove();
        appendLine(`<span style="color:#f85149;">Connection error: ${esc(err.message)}<br><small style="color:#8b949e;">iMac 터널이 꺼졌거나 주소가 바뀌었을 수 있습니다. [● iMac]에서 endpoint를 확인하세요.</small></span>`);
      }
      appendLine('<br>');
    }
  </script>
</body>
</html>
